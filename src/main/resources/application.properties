server.port=${SERVER_PORT:8080}
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.jks}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:JKS}
server.ssl.key-alias=${SSL_KEY_ALIAS:springboot}
server.ssl.key-password=${SSL_KEY_PASSWORD:}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stock_monitor_system?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.pollingIntervalSeconds=${POLLING_INTERVAL_SECONDS:5}
app.dailyProcessor.updatePrevOpenCloseCron=${UPDATE_PREV_OPEN_CLOSE_CRON:0 30 9 * * MON-FRI}
app.dailyProcessor.CloseNoon=${CLOSE_NOON_CRON:0 30 11 * * MON-FRI}
app.dailyProcessor.OpenNoon=${OPEN_NOON_CRON:0 0 13 * * MON-FRI}
app.dailyProcessor.updateDailyDataCron=${UPDATE_DAILY_DATA_CRON:0 30 15 * * MON-FRI}

jwt.secret.access=${JWT_ACCESS_SECRET:change-me-in-local-env}
jwt.secret.refresh=${JWT_REFRESH_SECRET:change-me-in-local-env}
jwt.expiration.access=${JWT_ACCESS_EXPIRATION_MINUTES:30}
jwt.expiration.refresh=${JWT_REFRESH_EXPIRATION_DAYS:15}

server.tomcat.uri-encoding=UTF-8
